[project]
name = "remote-kvm"
version = "0.1.0"
description = "Browser-controlled USB HID KVM for Orange Pi 5"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
remote-kvm = "remote_kvm.__main__:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
