[project]
name = "remote-power-controller"
version = "0.1.0"
description = "Browser-controlled GPIO power switch for Linux SBCs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.142.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
remote-kvm = "remote_kvm.__main__:main"

[tool.uv.build-backend]
module-name = "remote_kvm"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
